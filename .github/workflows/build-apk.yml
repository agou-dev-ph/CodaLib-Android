
name: Build CodaLib APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and build project
        run: |
          unzip -q CodaLib-Android-Project.zip
          cd CodaLib-Android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CodaLib-APK
          path: CodaLib-Android/app/build/outputs/apk/debug/app-debug.apk
          
